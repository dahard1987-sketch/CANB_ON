<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1ea">
  <title>로그인 | READi 업데이터</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand login-brand" href="{{ url_for('login') }}" aria-label="READi 업데이터 로그인">
        <img src="{{ url_for('static', filename='favicon.svg') }}" alt="">
        <span>READi 업데이터</span>
      </a>

      <h1 id="login-title">비밀번호 입력</h1>

      <form class="login-form" method="post" action="{{ url_for('login') }}">
        <div class="field-group">
          <label for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            required
            autofocus
            {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}
            {% if unavailable %}disabled{% endif %}
          >
          {% if error %}
          <p id="login-error" class="form-error" role="alert">{{ error }}</p>
          {% endif %}
        </div>

        <button class="login-button" type="submit" {% if unavailable %}disabled{% endif %}>들어가기</button>
      </form>
    </section>
  </main>
</body>
</html>
