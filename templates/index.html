<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151713">
  <title>READi 업데이터</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main class="app-shell">
    <section class="workspace">
      <header class="topbar">
        <a class="brand" href="/" aria-label="레벨 시트 업데이트 홈">
          <img src="{{ url_for('static', filename='favicon.svg') }}" alt="">
          <span>READi 업데이터</span>
        </a>
      </header>

      <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="엑셀 파일 업로드 또는 끌어놓기">
        <input id="fileInput" type="file" accept=".xlsx,.xlsm" multiple hidden>
        <div id="dropzoneIdle" class="dropzone-content">
          <div class="drop-filetype" aria-hidden="true">XLS</div>
          <h1>파일을 끌어놓으세요</h1>
          <p>또는 <span id="browseButton" class="browse-link">파일 업로드</span></p>
        </div>
        <div id="processingState" class="processing-state" role="status" aria-live="polite" hidden>
          <span class="processing-spinner" aria-hidden="true"></span>
          <strong id="processingTitle">파일을 확인하고 있어요</strong>
          <span id="processingDetail">잠시만 기다려 주세요.</span>
        </div>
      </section>

      <div id="notice" class="notice" aria-live="polite" hidden></div>
    </section>

    <aside class="sidebar">
      <div class="sidebar-heading">
        <div>
          <h2>등록된 파일</h2>
        </div>
        <span id="fileCount" class="count">0 / {{ levels|length }}</span>
      </div>

      <div id="levelSlots" class="level-slots" data-total="{{ levels|length }}">
        {% for level in levels %}
        <article class="level-slot" data-level="{{ level }}">
          <div class="slot-head">
            <strong>{{ level }}</strong>
            <span class="slot-state">대기</span>
          </div>
          <div class="slot-copy">
            <span class="slot-filename">파일 없음</span>
            <span class="slot-error"></span>
          </div>
          <button class="remove-button" type="button" aria-label="{{ level }} 파일 제거">제거</button>
        </article>
        {% endfor %}
      </div>

      <div class="sidebar-footer">
        <div class="summary-line">
          <span>업데이트 대상</span>
          <strong><span id="readyCount">0</span>개 파일</strong>
        </div>
        <button id="publishButton" class="publish-button" type="button" disabled>
          <span>등록된 모든 파일 업데이트</span>
        </button>
      </div>
    </aside>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
